  #   #   - PXXXXXX

  # Oracle Database - Live monitoring and performance tuning
  oracle:
    host: ${ORACLE_DB_HOST:-10.38.130.91}
    port: ${ORACLE_DB_PORT:-1114}
    username: ${ORACLE_DB_USER:-opensre}
    password: ${ORACLE_DB_PASSWORD:-opensre}
